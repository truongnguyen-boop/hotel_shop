# Quarkus development configuration
quarkus.profile=dev
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# Đặt tiền tố /api cho tất cả các JAX-RS Resources
quarkus.rest.path=/api

# MySQL configuration for local development
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/hotel_22
quarkus.datasource.username=root
quarkus.datasource.password=helloaesv@
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.sql-load-script=no-file

# MongoDB configuration
quarkus.mongodb.connection-string=mongodb://localhost:27017/?replicaSet=rs0
quarkus.mongodb.database=hotel22_mongo

# =============================================
# CORS configuration - Fixed for ngrok/BrowserStack
# =============================================
quarkus.http.cors=true

# Cho phép tất cả origins (dùng khi test với ngrok/BrowserStack)
quarkus.http.cors.origins=/.*/

# Cho phép các phương thức HTTP cần thiết
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS,PATCH

# Thêm ngrok-skip-browser-warning vào danh sách headers được phép
quarkus.http.cors.headers=Content-Type,Authorization,X-Requested-With,Accept,Origin,ngrok-skip-browser-warning

# Tắt credentials khi dùng wildcard origin (bắt buộc, không thể dùng cả 2)
quarkus.http.cors.access-control-allow-credentials=false

# Cho phép các request OPTIONS đi qua mà không cần token
quarkus.security.permit-all-options=true

# =============================================
# JWT Configuration
# =============================================
smallrye.jwt.enabled=true
mp.jwt.verify.issuer=https://example.com/hotel22